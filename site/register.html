<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация аккаунта — NEBULA CLIENT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navigation Header -->
<header class="top">
  <a href="/" class="logo">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    </div>
    NEBULA <span>CLIENT</span>
  </a>

  <nav class="nav">
    <a href="/">Главная</a>
    <a href="/shop">Магазин</a>
    <a href="/login">Вход</a>
  </nav>

  <div class="nav-actions">
    <a href="/login" class="btn btn-secondary btn-sm">Вход в аккаунт</a>
  </div>
</header>

<!-- Auth Card -->
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="badge badge-cyan" style="margin-bottom: 12px;">НОВЫЙ АККАУНТ</div>
      <h2>Создать аккаунт</h2>
      <p>Зарегистрируйтесь для привязки ключей и доступа к софту</p>
    </div>

    <!-- Tab switcher -->
    <div class="tab-switch">
      <a href="/login" class="tab-btn">Вход</a>
      <a href="/register" class="tab-btn active">Регистрация</a>
    </div>

    <form onsubmit="event.preventDefault(); doReg();">
      <div class="form-group">
        <label class="form-label" for="login">Логин</label>
        <div class="input-container">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input class="form-input" id="login" type="text" placeholder="Придумайте логин (от 3 симв.)" autocomplete="username" autofocus required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="pass">Пароль</label>
        <div class="input-container">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input class="form-input" id="pass" type="password" placeholder="Пароль (минимум 4 симв.)" autocomplete="new-password" required>
        </div>
      </div>

      <button class="btn btn-primary btn-glow" type="button" id="btn" onclick="doReg()" style="width: 100%; margin-top: 10px; padding: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
        Зарегистрироваться
      </button>

      <div class="err" id="err"></div>

      <p class="form-notice">
        Уже есть аккаунт? <a href="/login" style="font-weight: 600;">Войти в кабинет</a>
      </p>
    </form>
  </div>
</div>

<script>
async function doReg() {
  const login = document.getElementById('login').value.trim();
  const password = document.getElementById('pass').value.trim();
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  
  err.textContent = '';
  err.className = 'err';

  if (login.length < 3) {
    err.textContent = 'Логин должен содержать от 3 символов';
    return;
  }
  if (!/^[a-zA-Z0-9_]+$/.test(login)) {
    err.textContent = 'Логин может содержать только латинские буквы, цифры и _';
    return;
  }
  if (password.length < 4) {
    err.textContent = 'Пароль должен содержать минимум 4 символа';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;">
      <line x1="12" y1="2" x2="12" y2="6"></line>
      <line x1="12" y1="18" x2="12" y2="22"></line>
      <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
      <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
      <line x1="2" y1="12" x2="6" y2="12"></line>
      <line x1="18" y1="12" x2="22" y2="12"></line>
      <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
      <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
    </svg>
    Создание...
  `;

  try {
    const r = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, password })
    });
    const j = await r.json().catch(() => ({}));

    if (!r.ok) {
      err.textContent = j.error || 'Ошибка регистрации';
      return;
    }

    err.className = 'ok';
    err.textContent = 'Аккаунт успешно создан! Перенаправление...';
    setTimeout(() => { location.href = '/login'; }, 850);
  } catch (e) {
    err.textContent = 'Ошибка соединения с сервером';
  } finally {
    btn.disabled = false;
    btn.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="8.5" cy="7" r="4"></circle>
        <line x1="20" y1="8" x2="20" y2="14"></line>
        <line x1="23" y1="11" x2="17" y2="11"></line>
      </svg>
      Зарегистрироваться
    `;
  }
}

document.getElementById('pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doReg();
});
document.getElementById('login').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('pass').focus();
});
</script>

<style>
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>

</body>
</html>
