<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход в аккаунт — NEBULA CLIENT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navigation Header -->
<header class="top">
  <a href="/" class="logo">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    </div>
    NEBULA <span>CLIENT</span>
  </a>

  <nav class="nav">
    <a href="/">Главная</a>
    <a href="/shop">Магазин</a>
    <a href="/register">Регистрация</a>
  </nav>

  <div class="nav-actions">
    <a href="/register" class="btn btn-secondary btn-sm">Создать аккаунт</a>
  </div>
</header>

<!-- Auth Card -->
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="badge" style="margin-bottom: 12px;">АВТОРИЗАЦИЯ</div>
      <h2>Добро пожаловать</h2>
      <p>Войдите для доступа к лоадеру и подписке</p>
    </div>

    <!-- Tab switcher -->
    <div class="tab-switch">
      <a href="/login" class="tab-btn active">Вход</a>
      <a href="/register" class="tab-btn">Регистрация</a>
    </div>

    <form onsubmit="event.preventDefault(); doLogin();">
      <div class="form-group">
        <label class="form-label" for="login">Логин</label>
        <div class="input-container">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input class="form-input" id="login" type="text" placeholder="Введите ваш логин" autocomplete="username" autofocus required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="pass">Пароль</label>
        <div class="input-container">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input class="form-input" id="pass" type="password" placeholder="Введите пароль" autocomplete="current-password" required>
        </div>
      </div>

      <button class="btn btn-primary btn-glow" type="button" id="btn" onclick="doLogin()" style="width: 100%; margin-top: 10px; padding: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        Войти в систему
      </button>

      <div class="err" id="err"></div>

      <p class="form-notice">
        Ещё нет аккаунта? <a href="/register" style="font-weight: 600;">Зарегистрироваться</a>
      </p>
    </form>
  </div>
</div>

<script>
function hwid() {
  return 'browser';
}

async function doLogin() {
  const login = document.getElementById('login').value.trim();
  const password = document.getElementById('pass').value.trim();
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');

  err.textContent = '';
  if (!login || !password) {
    err.textContent = 'Введи логин и пароль';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;">
      <line x1="12" y1="2" x2="12" y2="6"></line>
      <line x1="12" y1="18" x2="12" y2="22"></line>
      <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
      <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
      <line x1="2" y1="12" x2="6" y2="12"></line>
      <line x1="18" y1="12" x2="22" y2="12"></line>
      <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
      <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
    </svg>
    Проверка...
  `;

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, password, hwid: hwid() })
    });
    const j = await r.json().catch(() => ({}));

    if (!r.ok) {
      err.textContent = j.error || 'Неверный логин или пароль';
      return;
    }

    localStorage.setItem('nebula_token', j.token);
    localStorage.setItem('nebula_login', j.login);
    location.href = '/profile';
  } catch (e) {
    err.textContent = 'Ошибка соединения с сервером';
  } finally {
    btn.disabled = false;
    btn.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
        <polyline points="10 17 15 12 10 7"></polyline>
        <line x1="15" y1="12" x2="3" y2="12"></line>
      </svg>
      Войти в систему
    `;
  }
}

document.getElementById('pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('login').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('pass').focus();
});
</script>

<style>
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>

</body>
</html>
